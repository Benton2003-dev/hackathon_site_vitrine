        <div class="container">
          <h2 class="title">Connexion <span>Tofidoux</span></h2>
          <p class="subtitle">Connectez-vous pour accéder à votre espace</p>
          <form class="signup-form">
              <div class="input-group">
                  <input type="email" required>
                  <label>Email</label>
                  <span class="border"></span>
              </div>
              <div class="input-group">
                  <input type="password" required>
                  <label>Mot de passe</label>
                  <span class="border"></span>
              </div>
              <button class="submit-btn">Se connecter</button>
          </form>
          <p class="login-link">Pas encore de compte ? <a href="#">Inscrivez-vous</a></p>
      </div>
