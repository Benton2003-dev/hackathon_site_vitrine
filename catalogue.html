<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="catalogue.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />


    <title>Catalogue_Tôfidoux</title>
</head>
<body>
    <header>

    </header>

    <main>
        <div class="container">
            <!-- Premier bloc (sidebar) -->
            <div class="sidebar">
              <!-- Input de recherche -->
              <div class="search-wrapper">
                <input type="text" placeholder="Rechercher..." class="search-input" />
                <i class="fas fa-search search-icon"></i>
                <!-- Icône de recherche -->
              </div>
      
              <!-- Bouton -->
              <div class="button">
                <button type="button" style="justify-content: space-around">
                  <span>Tous les produits</span>
                  <span>255 produits</span>
                </button>
              </div>
      
              <!-- Texte -->
              <p class="description">Recherchez par catégories</p>
      
              <!-- Séparateur -->
              <hr class="separator" />
              <!-- Dropdowns -->
              <div class="dropdown">
                <button class="dropdown-btn">
                  Filtrer par <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content">
                  <a href="#">Option 1</a>
                  <a href="#">Option 2</a>
                  <a href="#">Option 3</a>
                </div>
              </div>
      
              <div class="dropdown">
                <button class="dropdown-btn">
                  Catégorie <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content">
                  <a href="#">Catégorie 1</a>
                  <a href="#">Catégorie 2</a>
                  <a href="#">Catégorie 3</a>
                </div>
              </div>
      
              <div class="dropdown">
                <button class="dropdown-btn">
                  Statut <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content">
                  <a href="#">Actif</a>
                  <a href="#">Inactif</a>
                  <a href="#">Suspendu</a>
                </div>
              </div>
            </div>
      
            <!-- Deuxième bloc (contenu) -->
            <div class="content">
              <div class="card">
                <img
                  src="images/IMG_3703.png"
                  alt="Chocolat"
                  class="card-image"
                />
      
                <!-- Icône Favori -->
                <div class="favorite-icon">
                  <i class="fas fa-heart"></i>
                </div>
      
                <div class="price">-223€</div>
      
                <div class="card-info">
                  <h4>Haribo Grenouilles - 400 g</h4>
                  <p class="card-price">18€</p>
      
                  <div class="quantity">
                    <!-- Contrôle de quantité -->
                    <div class="quantity-control">
                      <span class="quantity-btn">-</span>
                      <span class="quantity-value">1</span>
                      <span class="quantity-btn">+</span>
                    </div>
      
                    <!-- Bouton d'achat -->
                    <div class="buy-button">
                      <i class="fas fa-shopping-cart"></i>
                    </div>
                  </div>
                </div>
              </div>
      
              <div class="card">
                <img
                  src="images/IMG_3700.png"
                  alt="Chocolat"
                  class="card-image"
                />
      
                <!-- Icône Favori -->
                <div class="favorite-icon">
                  <i class="fas fa-heart"></i>
                </div>
      
                <div class="price">-223€</div>
      
                <div class="card-info">
                  <h4>Haribo Grenouilles - 400 g</h4>
                  <p class="card-price">18€</p>
      
                  <div class="quantity">
                    <!-- Contrôle de quantité -->
                    <div class="quantity-control">
                      <span class="quantity-btn">-</span>
                      <span class="quantity-value">1</span>
                      <span class="quantity-btn">+</span>
                    </div>
      
                    <!-- Bouton d'achat -->
                    <div class="buy-button">
                      <i class="fas fa-shopping-cart"></i>
                    </div>
                  </div>
                </div>
              </div>
      
              <div class="card">
                <img
                  src="images/IMG_3674.png"
                  alt="Chocolat"
                  class="card-image"
                />
      
                <!-- Icône Favori -->
                <div class="favorite-icon">
                  <i class="fas fa-heart"></i>
                </div>
      
                <div class="price">-223€</div>
      
                <div class="card-info">
                  <h4>Haribo Grenouilles - 400 g</h4>
                  <p class="card-price">18€</p>
      
                  <div class="quantity">
                    <!-- Contrôle de quantité -->
                    <div class="quantity-control">
                      <span class="quantity-btn">-</span>
                      <span class="quantity-value">1</span>
                      <span class="quantity-btn">+</span>
                    </div>
      
                    <!-- Bouton d'achat -->
                    <div class="buy-button">
                      <i class="fas fa-shopping-cart"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
      
      
    </main>

    <footer>

    </footer>
</body>
</html>
